<mat-sidenav-container class="h-full border-r pf-surface pf-text">
  <mat-sidenav class="shell-sidenav" [mode]="'side'" [opened]="opened">
    <div class="sidebar-frame">
      <app-sidebar class="h-full w-full"></app-sidebar>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="flex justify-between items-center pf-surface pf-text">
      <button mat-icon-button (click)="toggle()" aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>

      <button
        mat-icon-button
        (click)="toggleTheme()"
        [matTooltip]="theme.theme() === 'dark' ? 'Modo claro' : 'Modo escuro'"
      >
        <mat-icon>{{
          theme.theme() === "dark" ? "light_mode" : "dark_mode"
        }}</mat-icon>
      </button>
    </mat-toolbar>

    <main class="shell-main">
      <div class="shell-page pf-surface pf-text">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
