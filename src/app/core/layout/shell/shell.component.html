<mat-sidenav-container class="shell-container">
  <mat-sidenav class="shell-sidenav" [mode]="'side'" [opened]="opened">
    <div class="sidebar-frame">
      <app-sidebar class="h-full w-full"></app-sidebar>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="shell-toolbar">
      <button mat-icon-button (click)="toggle()" aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="text-3xl">Personal Finance</span>

      <span class="flex-1"></span>
    </mat-toolbar>

    <main class="shell-main">
      <div class="shell-page">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
