<div class="flex flex-col justify-between h-full">
  <div>
    <div class="px-4 py-4 border-b">
      <div class="text-3xl">Personal Finance</div>
    </div>

    <mat-nav-list class="pt-2">
      <a
        mat-list-item
        *ngFor="let item of nav"
        [routerLink]="item.path"
        routerLinkActive="active-link"
        class="list-pages"
      >
        <span class="nav-row">
          <mat-icon class="mr-3">{{ item.icon }}</mat-icon>
          <span class="text-2xl">{{ item.label }}</span>
        </span>
      </a>
    </mat-nav-list>
  </div>

  <div class="mt-auto pt-4 text-center text-base pf-muted">
    <div>Personal Finance · v1.0.0</div>
    <div class="mt-1">© 2026 Rafael Füllenbach</div>
  </div>
</div>
