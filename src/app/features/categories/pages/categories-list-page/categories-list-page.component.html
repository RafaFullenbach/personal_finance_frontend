<div class="h-full flex flex-col min-h-0">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h1 class="text-4xl font-semibold mb-1">Categorias</h1>
      <p class="text-2xl text-slate-500">
        Gerencie categorias de receita e despesa.
      </p>
    </div>

    <button
      mat-flat-button
      color="primary"
      class="!rounded-lg !py-3 !px-6"
      [routerLink]="['/categories/new']"
    >
      <span class="flex items-center gap-3">
        <mat-icon class="!text-[2rem] !w-[2rem] !h-[2rem]">add</mat-icon>
        <span class="text-2xl font-medium leading-none">Nova categoria</span>
      </span>
    </button>
  </div>

  @if (store.vm().error; as err) {
    <div
      class="mb-4 p-4 rounded-lg border border-red-200 bg-red-50 text-red-800"
    >
      {{ err.message }}
      @if (err.code) {
        <span class="ml-2 text-xs opacity-80">({{ err.code }})</span>
      }
    </div>
  }

  @if (store.vm().loading) {
    <div class="mt-6">Carregando...</div>
  } @else {
    <div
      class="rounded-lg border border-slate-200 bg-white overflow-hidden flex-1 min-h-0"
    >
      <div class="overflow-auto">
        <table
          mat-table
          [dataSource]="store.vm().items"
          class="w-full table-lg"
        >
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nome</th>
            <td mat-cell *matCellDef="let c">{{ c.name }}</td>
          </ng-container>

          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>Tipo</th>
            <td mat-cell *matCellDef="let c">
              {{ c.type === "Expense" ? "Despesa" : "Receita" }}
            </td>
          </ng-container>

          <ng-container matColumnDef="activate">
            <th mat-header-cell *matHeaderCellDef>Ativar/Desativar</th>
            <td mat-cell *matCellDef="let a">
              <mat-slide-toggle
                [checked]="a.isActive"
                (change)="a.isActive ? deactivate(a.id) : activate(a.id)"
              ></mat-slide-toggle>
            </td>
          </ng-container>

          <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef class="w-[160px]">Editar</th>
            <td mat-cell *matCellDef="let c">
              <button
                mat-icon-button
                [routerLink]="['/categories', c.id, 'edit']"
                matTooltip="Editar"
              >
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </div>
  }
</div>
