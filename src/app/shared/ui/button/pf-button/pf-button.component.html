<button
  [attr.type]="type"
  [color]="color"
  [disabled]="isDisabled"
  [routerLink]="routerLink"
  mat-flat-button
  *ngIf="variant === 'flat'"
  class="{{ sizeClass }}"
>
  <span class="flex items-center gap-3">
    <mat-icon
      *ngIf="icon && iconPosition === 'left'"
      class="!text-[2rem] !w-[2rem] !h-[2rem]"
    >
      {{ icon }}
    </mat-icon>

    <span class="{{ labelClass }}">
      <ng-container *ngIf="label; else projected">{{ label }}</ng-container>
      <ng-template #projected><ng-content /></ng-template>
    </span>

    <mat-icon
      *ngIf="icon && iconPosition === 'right'"
      class="!text-[2rem] !w-[2rem] !h-[2rem]"
    >
      {{ icon }}
    </mat-icon>
  </span>
</button>
